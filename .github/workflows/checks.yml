name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install policy check dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Enforce tracked-file policy
        run: python scripts/check.py policy
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh Tests/*.sh; do
            bash -n "$script"
          done
      - name: Check motion and wake behavior
        run: make test
      - name: Build and package Uduo with ad hoc signing
        env:
          CODE_SIGN_IDENTITY: '-'
        run: make package
